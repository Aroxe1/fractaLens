/*
 * Gradle's configuration to compile and run the project.
 */

// The plugins allowing Gradle to manage the project as a Java application.
plugins {
    id 'application'
    id 'jacoco'
    id 'java'
    id 'org.sonarqube' version '7.5.0.8588'
}

application {
    mainClass = 'fr.univartois.butinfo.fractalens.Main'
}

// The version of Java used in the project.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// The repositories from which dependencies should be downloaded.
repositories {
    mavenCentral()
}

// The dependencies of the project.
dependencies {
    implementation 'info.picocli:picocli:4.7.6'
    implementation 'com.madgag:animated-gif-lib:1.4'
    implementation 'org.apache.logging.log4j:log4j-api:2.25.1'
    runtimeOnly 'org.apache.logging.log4j:log4j-core:2.25.1'
    // Dependencies for unit tests
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// The configuration of JUnit Jupiter for unit tests.
tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()

    // Ensure that the JaCoCo report is generated after tests are run.
    finalizedBy jacocoTestReport
}

// The configuration of JaCoCo for code coverage reporting.
jacoco {
    toolVersion = '0.8.15'
}

tasks.named('jacocoTestReport') {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn test
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

tasks.named('check') {
    dependsOn jacocoTestCoverageVerification
}

tasks.named('javadoc') {
    options.encoding = 'UTF-8'
    options.author = true
    options.addBooleanOption('Xdoclint:all', true)
}

tasks.named('sonar') {
    dependsOn test, jacocoTestReport
}

// The configuration of the SonarQube static analysis.
sonar {
    properties {
        property("sonar.host.url", "https://sonarqube.univ-artois.fr")
        property("sonar.projectKey", "fractalensLGMA")
        property("sonar.coverage.jacoco.xmlReportPaths", layout.buildDirectory.file('reports/jacoco/test/jacocoTestReport.xml').get().asFile.absolutePath)
    }
}
