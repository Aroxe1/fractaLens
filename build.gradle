/*
 * La configuration de Gradle pour compiler et exécuter le projet.
 */

// Les plugins permettant à Gradle de gérer le projet en tant qu'application Java.
plugins {
    id 'application'
    id 'java'
}

// La version du langage Java utilisée dans le projet.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(25)
    }
}

// Les dépôts d'où les dépendances doivent être téléchargées.
repositories {
    mavenCentral()
}

// Les dépendances du projet.
dependencies {
    // Dépendances pour les tests unitaires.
    testImplementation libs.junit.jupiter
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Configuration de JUnit Jupiter pour les tests unitaires.
tasks.named('test') {
    useJUnitPlatform()
}
